<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RutiCard — Iniciar sesión</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*,
*::before,
*::after{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:'Inter',sans-serif;
    background:#f4f4f2;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
    color:#1a1a1a;
}

/* TARJETA */
.card{
    position:relative;
    width:100%;
    max-width:500px;
    background:#fff;
    border:1px solid #e5e5e3;
    border-radius:18px;
    padding:110px 48px 48px;
    box-shadow:0 10px 30px rgba(0,0,0,.04);
}

/* LOGO */
.logo-wrap{
    position:absolute;
    top:0;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:10;
}

.logo-img{
    width:140px;
    height:140px;
    object-fit:contain;
    background:#fff;
    border-radius:50%;
    padding:8px;
}

/* TITULOS */
h1{
    font-size:32px;
    font-weight:700;
    margin-bottom:8px;
}

.sub{
    font-size:15px;
    color:#777;
    margin-bottom:32px;
}

/* CAMPOS */
.field{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    font-weight:600;
    color:#555;
}

input{
    width:100%;
    padding:14px 16px;
    border:1px solid #dddddb;
    border-radius:10px;
    background:#fafaf9;
    font-size:16px;
    font-family:'Inter',sans-serif;
    transition:.2s;
}

input:focus{
    outline:none;
    border-color:#1a1a1a;
    background:#fff;
    box-shadow:0 0 0 3px rgba(26,26,26,.08);
}

input::placeholder{
    color:#b6b6b6;
}

/* BOTON */
button{
    width:100%;
    padding:15px;
    margin-top:8px;
    border:none;
    border-radius:10px;
    background:#1a1a1a;
    color:#fff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:#333;
}

button:active{
    transform:scale(.98);
}

/* ERROR */
.error{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:8px;
    background:#fff5f5;
    border:1px solid #ffd5d5;
    color:#c0392b;
    font-size:14px;
}

/* RESPONSIVE */
@media (max-width: 600px){

    .card{
        padding:90px 24px 24px;
    }

    .logo-img{
        width:110px;
        height:110px;
    }

    h1{
        font-size:28px;
    }
}
</style>
</head>

<body>

<div class="card">

    <!-- Logo -->
    <div class="logo-wrap">
        <img src="img/logo.jpg" alt="RutiCard" class="logo-img">
    </div>

    <h1>Iniciar sesión</h1>
    <p class="sub">Ingresa tus credenciales para continuar.</p>

    <div class="field">
        <label for="usuario">Usuario</label>
        <input
            id="usuario"
            type="text"
            placeholder="Ej. M01"
            autocomplete="off">
    </div>

    <div class="field">
        <label for="password">Contraseña</label>
        <input
            id="password"
            type="password"
            placeholder="••••••••"
            onkeydown="if(event.key==='Enter') login()">
    </div>

    <button onclick="login()">Ingresar</button>

    <div class="error" id="errorMsg">
        ⚠ Usuario o contraseña incorrectos.
    </div>

</div>

<script src="app.js"></script>

<script>
window.alert = function () {
    document.getElementById('errorMsg').style.display = 'block';
};
</script>

</body>
</html>
