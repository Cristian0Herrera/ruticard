<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RutiCard — Administrador</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: #87acd33d;
    color: #1a1a1a;
    min-height: 100vh;
  }

  /* NAV */
  nav {
    background: rgb(127, 181, 253);
    border-bottom:none;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    padding: 0 24px;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .nav-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }
.nav-logo {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  overflow: hidden;
  flex-shrink: 0;
}

.nav-logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

  .nav-name {
    font-size: 25px;
    font-weight: 600;
    color: #ffffff;
    letter-spacing: -0.2px;
  }

  .nav-name span { color: #ffffff; font-weight: 400; }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .nav-role {
    font-size: 12px;
    color: #000000;
    display: none;
  }

  @media (min-width: 500px) { .nav-role { display: block; } }

  .btn-logout {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: #000000;
    background: #425fdd5b;
    border: 1px solid #3d55d198;
    border-radius: 6px;
    padding: 6px 14px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-logout:hover { border-color: #497be9; color: #ffffff; }

  /* MAIN */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 28px 16px 64px;
  }

  @media (min-width: 600px) { main { padding: 28px 24px 64px; } }

  .page-head { margin-bottom: 20px; }
  .page-head h1 { font-size: 18px; font-weight: 600; }
  .page-head p  { font-size: 13px; color: #000000; margin-top: 2px; }

  /* STATS */
  .stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }

  @media (min-width: 640px) {
    .stats { grid-template-columns: repeat(4, 1fr); }
  }

  .stat {
    background: #fff;
    border: 1px solid #e5e5e3;
    border-radius: 10px;
    padding: 14px 16px;
  }

  .stat-label {
    font-size: 11px;
    font-weight: 500;
    color: #000000;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .stat-value { font-size: 26px; font-weight: 600; color: #1a1a1a; }
  .s-tiempo .stat-value { color: #16a34a; }
  .s-tarde  .stat-value { color: #d97706; }
  .s-ant    .stat-value { color: #2563eb; }

  /* FILTERS */
.filters{
  display:grid;
  gap:8px;
  margin-bottom:14px;
}

.date-range{
  display:flex;
  align-items:center;
  gap:8px;
}

.date-range span{
  color:#666;
  font-size:14px;
  font-weight:500;
}

.date-range input{
  min-width:150px;
}

@media (max-width:768px){

  .filters{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
  }

  .date-range{
    width:100%;
  }

  .date-range input{
    flex:1;
    min-width:0;
  }

  .filters button{
    width:100%;
  }
}

/* Móvil */
@media (max-width: 768px){

  .filters{
    grid-template-columns: 1fr 1fr;
  }

  /* Buscador ocupa toda la fila */
  #filtroNombre{
    grid-column: 1 / -1;
  }

  /* Inputs fecha */
  #fechaInicio,
  #fechaFin{
    width:100%;
  }

  /* Botones 2 por fila */
  .filters button{
    width:100%;
  }
}

/* Tablet y PC */
@media (min-width: 769px){

  .filters{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
  }

  .filters input[type="text"]{
    flex:1;
    min-width:250px;
  }
}

  .filters input {
    flex: 1;
    min-width: 140px;
    padding: 9px 12px;
    border: 1px solid #e0e0de;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: #1a1a1a;
    background: #fff;
    outline: none;
    transition: border-color 0.15s;
  }
  .filters input:focus { border-color: #1a1a1a; }
  .filters input::placeholder { color: #bbb; }

    .filters button{
    font-family:'Inter',sans-serif;
    font-size:12px;
    font-weight:500;
    color:#888;
    background:#fff;
    border:1px solid #e0e0de;
    border-radius:8px;
    padding:9px 14px;
    cursor:pointer;
    transition:.15s;
  }

  .filters button:hover{
    border-color:#aaa;
    color:#333;
  }

  .btn-clear {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: #888;
    background: #fff;
    border: 1px solid #e0e0de;
    border-radius: 8px;
    padding: 9px 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .btn-clear:hover { border-color: #aaa; color: #333; }

  /* TABLE */
  .table-wrap {
    background: #fff;
    border: 1px solid #e5e5e3;
    border-radius: 10px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  table { width: 100%; border-collapse: collapse; min-width: 540px; }

  thead th {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #000000;
    padding: 12px 16px;
    text-align: left;
    border-bottom: 1px solid #e5e5e3;
    background: #fafaf9;
    white-space: nowrap;
  }

  tbody tr { border-bottom: 1px solid #f0f0ee; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #fafaf9; }

  tbody td { padding: 12px 16px; font-size: 13px; color: #333; white-space: nowrap; }

  .id-tag {
    font-size: 11px;
    font-weight: 500;
    background: #f1f1ef;
    color: #555;
    padding: 3px 8px;
    border-radius: 5px;
  }

  .badge {
    font-size: 11px;
    font-weight: 500;
    padding: 3px 9px;
    border-radius: 5px;
    display: inline-block;
    white-space: nowrap;
  }
  .b-tiempo   { background: #dcfce7; color: #166534; }
  .b-tarde    { background: #fef3c7; color: #92400e; }
  .b-muytarde { background: #fee2e2; color: #991b1b; }
  .b-ant      { background: #dbeafe; color: #1e3a8a; }

  .empty td { text-align: center; padding: 40px; color: #bbb; font-size: 13px; }
</style>
</head>
<body>
<script>
if (localStorage.getItem("sesion") !== "admin") {
    window.location.href = "index.html";
}
</script>

<nav>
  <div class="nav-brand">
    <div class="nav-logo">
      <img src="img/mini-logo.jpeg" alt="RutiCard">
    </div>
    <span class="nav-name">RutiCard</span>
  </div>
  <div class="nav-right">
    <span class="nav-role">Administrador</span>
    <button class="btn-logout" onclick="cerrarSesion()">Cerrar sesión</button>
  </div>
</nav>

<main>
  <div class="page-head">
    <h1>Panel administrador</h1>
    <p>Todos los registros del sistema</p>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">Total</div>
      <div class="stat-value" id="total">0</div>
    </div>
    <div class="stat s-tiempo">
      <div class="stat-label">A tiempo</div>
      <div class="stat-value" id="atiempo">0</div>
    </div>
    <div class="stat s-tarde">
      <div class="stat-label">Tarde</div>
      <div class="stat-value" id="tarde">0</div>
    </div>
    <div class="stat s-ant">
      <div class="stat-label">Anticipado</div>
      <div class="stat-value" id="anticipado">0</div>
    </div>
  </div>

  <div class="filters">
    <input type="text" id="filtroNombre" placeholder="Buscar conductor..." onkeyup="cargar()">
<div class="date-range">
    <input type="date" id="fechaInicio" onchange="cargar()">
    <span>—</span>
    <input type="date" id="fechaFin" onchange="cargar()">
</div>
    <button onclick="hoy()">Hoy</button>
    <button onclick="ultimaSemana()">Últimos 7 días</button>
    <button onclick="esteMes()">Este mes</button>
    <button class="btn-clear" onclick="limpiarFiltros()">Limpiar</button>

</div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Fecha</th>
          <th>Hora</th>
          <th>Ruta</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody id="tabla">
        <tr class="empty"><td colspan="6">Cargando...</td></tr>
      </tbody>
    </table>
  </div>
</main>

<script>
const URL = "https://script.google.com/macros/s/AKfycbxyDnxmULakEOrZuoXtDwZDHiZ39mCg7B1x6xtYJNA4iGSYHtIfzop8aFliUJxsiVedXw/exec?action=listar";

function cerrarSesion() {
    localStorage.removeItem("sesion");
    localStorage.removeItem("conductor");

    window.location.href = "index.html";
}
function limpiarFiltros() {
  document.getElementById("filtroNombre").value = "";
  document.getElementById("fechaInicio").value = "";
  document.getElementById("fechaFin").value = "";
  cargar();
}

  function hoy() {

    const hoy = new Date().toISOString().split("T")[0];

    document.getElementById("fechaInicio").value = hoy;
    document.getElementById("fechaFin").value = hoy;

    cargar();
  }

  function ultimaSemana() {

    const hoy = new Date();

    const hace7Dias = new Date();
    hace7Dias.setDate(hoy.getDate() - 6);

    document.getElementById("fechaInicio").value =
      hace7Dias.toISOString().split("T")[0];

    document.getElementById("fechaFin").value =
      hoy.toISOString().split("T")[0];

    cargar();
  }

  function esteMes() {

    const hoy = new Date();

    const primerDia =
      new Date(hoy.getFullYear(), hoy.getMonth(), 1);

    document.getElementById("fechaInicio").value =
      primerDia.toISOString().split("T")[0];

    document.getElementById("fechaFin").value =
      hoy.toISOString().split("T")[0];

    cargar();
  }

function badgeClass(e) {
  if (e === "A TIEMPO")   return "b-tiempo";
  if (e === "TARDE")      return "b-tarde";
  if (e === "MUY TARDE")  return "b-muytarde";
  if (e === "ANTICIPADO") return "b-ant";
  return "";
}

async function cargar() {
  try {
    const res = await fetch(URL);
    const datos = await res.json();
    const nombre = document.getElementById("filtroNombre").value.toLowerCase();
    const fechaInicio = document.getElementById("fechaInicio").value;
    const fechaFin = document.getElementById("fechaFin").value;

    let html = "", total = 0, atiempo = 0, tarde = 0, anticipado = 0;

    datos.reverse().forEach(r => {
      if (nombre && !`${r.nombre} ${r.apellido}`.toLowerCase().includes(nombre)) return;
      let fechaRegistro = "";

      if (String(r.fecha).includes("T")) {

        const f = new Date(r.fecha);

        fechaRegistro =
          f.getFullYear() + "-" +
          String(f.getMonth() + 1).padStart(2, "0") + "-" +
          String(f.getDate()).padStart(2, "0");

      } else {

        const partes = String(r.fecha).split("/");

        fechaRegistro =
          partes[2] + "-" +
          partes[1].padStart(2, "0") + "-" +
          partes[0].padStart(2, "0");
      }

      if (fechaInicio && fechaRegistro < fechaInicio) return;

      if (fechaFin && fechaRegistro > fechaFin) return;

      total++;
      if (r.estado === "A TIEMPO")   atiempo++;
      if (r.estado === "TARDE")      tarde++;
      if (r.estado === "ANTICIPADO") anticipado++;

      let fd = r.fecha, ho = r.hora;
      if (String(fd).includes("T")) fd = new Date(fd).toLocaleDateString("es-SV");
      if (String(ho).includes("T")) ho = new Date(ho).toLocaleTimeString("es-SV");

      html += `<tr>
        <td><span class="id-tag">${r.id}</span></td>
        <td>${r.nombre} ${r.apellido}</td>
        <td>${fd}</td><td>${ho}</td><td>${r.ruta}</td>
        <td><span class="badge ${badgeClass(r.estado)}">${r.estado}</span></td>
      </tr>`;
    });

    document.getElementById("tabla").innerHTML = html || `<tr class="empty"><td colspan="6">Sin resultados</td></tr>`;
    document.getElementById("total").innerText     = total;
    document.getElementById("atiempo").innerText   = atiempo;
    document.getElementById("tarde").innerText     = tarde;
    document.getElementById("anticipado").innerText = anticipado;
  } catch(e) {
    document.getElementById("tabla").innerHTML = `<tr class="empty"><td colspan="6">Error al cargar</td></tr>`;
  }
}

cargar();
setInterval(cargar, 2000);
</script>

<script>
window.history.pushState(null, "", window.location.href);

window.onpopstate = function () {
    window.history.pushState(null, "", window.location.href);
};
</script>
</body>
</html>
