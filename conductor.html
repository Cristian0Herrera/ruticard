<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<title>Conductor</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

.estado-tiempo{
  background:#70b318;
  font-weight:bold;
}

.estado-tarde{
  background:#e0bc2b;
  font-weight:bold;
}

.estado-muy-tarde{
  background:#d12340;
  color:white;
  font-weight:bold;
}

.estado-anticipado{
  background:#2ff0f7;
  font-weight:bold;
}

</style>

</head>

<body>

<div class="container mt-4">

<h2>Mis Marcaciones</h2>

<div class="d-flex justify-content-between align-items-center mb-3">

  <h4 id="nombreConductor"></h4>

  <button class="btn btn-danger" onclick="cerrarSesion()">
    Cerrar sesión
  </button>

</div>

<div class="row mb-4">

  <div class="col-md-3">
    <div class="card text-center">
      <div class="card-body">
        <h5>Total</h5>
        <h3 id="total">0</h3>
      </div>
    </div>
  </div>

  <div class="col-md-3">
    <div class="card text-center">
      <div class="card-body">
        <h5>A Tiempo</h5>
        <h3 id="atiempo">0</h3>
      </div>
    </div>
  </div>

  <div class="col-md-3">
    <div class="card text-center">
      <div class="card-body">
        <h5>Tarde</h5>
        <h3 id="tarde">0</h3>
      </div>
    </div>
  </div>

  <div class="col-md-3">
    <div class="card text-center">
      <div class="card-body">
        <h5>Anticipado</h5>
        <h3 id="anticipado">0</h3>
      </div>
    </div>
  </div>

</div>

<table class="table table-bordered">

<thead>

<tr>

<th>Fecha</th>
<th>Hora</th>
<th>Ruta</th>
<th>Estado</th>

</tr>

</thead>

<tbody id="tabla">

</tbody>

</table>

</div>

<script>

const URL =
"https://script.google.com/macros/s/AKfycbxyDnxmULakEOrZuoXtDwZDHiZ39mCg7B1x6xtYJNA4iGSYHtIfzop8aFliUJxsiVedXw/exec?action=listar";

const conductor = localStorage.getItem("conductor");

// Mostrar nombre arriba
document.getElementById("nombreConductor").innerText =
"Conductor: " + conductor;

// Cerrar sesión
function cerrarSesion() {

  localStorage.removeItem("conductor");

  window.location.href = "index.html";
}

async function cargar(){

  const res = await fetch(URL);
  const datos = await res.json();

    let html = "";
    let total = 0;
    let atiempo = 0;
    let tarde = 0;
    let anticipado = 0;


  datos.forEach(r => {

    if (r.id !== conductor) return;


    total++;

    if(r.estado === "A TIEMPO") atiempo++;
    if(r.estado === "TARDE") tarde++;
    if(r.estado === "ANTICIPADO") anticipado++;


    let fecha = r.fecha;
    let hora = r.hora;

    if (String(fecha).includes("T")) {
      fecha = new Date(fecha).toLocaleDateString("es-SV");
    }

    if (String(hora).includes("T")) {
      hora = new Date(hora).toLocaleTimeString("es-SV");
    }

    let colorEstado = "";

    if (r.estado === "A TIEMPO") {
      colorEstado = "table-success";
    }
    else if (r.estado === "TARDE") {
      colorEstado = "table-warning";
    }
    else if (r.estado === "MUY TARDE") {
      colorEstado = "table-danger";
    }
    else if (r.estado === "ANTICIPADO") {
      colorEstado = "table-info";
    }

    html += `
      <tr>
        <td>${fecha}</td>
        <td>${hora}</td>
        <td>${r.ruta}</td>
        <td class="${colorEstado}">
          <strong>${r.estado}</strong>
        </td>
      </tr>
    `;
  });

    document.getElementById("tabla").innerHTML = html;
    document.getElementById("total").innerText = total;
    document.getElementById("atiempo").innerText = atiempo;
    document.getElementById("tarde").innerText = tarde;
    document.getElementById("anticipado").innerText = anticipado;
}

cargar();
setInterval(cargar, 2000);

</script>




</body>
</html>
